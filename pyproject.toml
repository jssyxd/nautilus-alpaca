[project]
name = "alpaca"
version = "0.1.0"
description = "Alpaca Adapter for NautilusTrader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader>=1.200.0",
    "websockets>=12.0",
    "msgspec>=0.18.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nautilus_trader"]
